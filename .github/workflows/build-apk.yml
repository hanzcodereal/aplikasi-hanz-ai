name: Build APK Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle (dengan cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Beri izin eksekusi gradlew
        run: chmod +x gradlew

      - name: Buat local.properties (API Key Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "apiKey=${GEMINI_API_KEY:-API_KEY_BELUM_DIISI}" > local.properties
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Secret GEMINI_API_KEY belum diisi. APK tetap dibuat, tetapi chat tidak akan berfungsi."
          fi

      - name: Siapkan keystore penandatangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/hanzai-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "Memakai keystore dari GitHub Secrets."
          else
            echo "::warning::KEYSTORE_BASE64 belum diisi. Membuat keystore sementara (APK tidak bisa di-update di atas versi build lain)."
            KEYSTORE_PASSWORD="hanzai-temp-pass"
            KEY_ALIAS="hanzai"
            KEY_PASSWORD="hanzai-temp-pass"
            keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Hanz Dev Official, O=Hanz Dev Official, C=ID"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APK Release
        run: ./gradlew assembleRelease -PappVersionCode=${{ github.run_number }} --stacktrace

      - name: Ganti nama file APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          OUT="HanzAI-v${VERSION}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: HanzAI-release-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Buat GitHub Release (khusus tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Hanz AI ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
